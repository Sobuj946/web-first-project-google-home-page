<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper scissors</title>
    <style>
        body{
            background-color: black;
            color: white;
            
        }
        .js-button {
            background-color: black;
            height:120px;
            width: 120px;
            border-radius: 60px;
            border:3px solid white;
            margin-right:10px;
            cursor: pointer;

        }
        .js-icon{
            height: 50px;
        }
    </style>
</head>

<body>
    <p>
        Rock Paper Scissors
    </p>
<button onclick="
    playGame('rock');
   " class="js-button">
        <img src="rock-emoji.png" class="js-icon">

</button>
<button onclick="
    playGame('paper'); " class="js-button">

    <img src="paper-emoji.png"  class="js-icon">

</button>
    <button onclick="
     playGame('scissors');
    " class="js-button">
    <img src="scissors-emoji.png" class="js-icon">
</button>
    <p class="js-result"></p>
    <p class="js-move"></p>
    <p class="js-score"></p>

    <button onclick="
    score.wins=0;
    score.losses=0;
    score.ties=0;
    localStorage.removeItem('score');
    updateScore();
    ">
        Reset Score
    </button>
    <script>
        const score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            ties: 0,
            losses: 0
        };
        updateScore();
        if (!score) {
            score = {
                wins: 0,
                ties: 0,
                losses: 0
            };
        }

        function playGame(playerMove) {
            const computerMove = pickComputerMove();
            let result = '';
            if (playerMove === 'scissors') {
                if (computerMove === 'Rock') {
                    result = 'You lose.';
                }
                else if (computerMove === 'Paper') {
                    result = 'You win.';
                }
                else if (computerMove === 'Scissors') {
                    result = 'Tie.'
                }
            }
            else if (playerMove === 'paper') {
                if (computerMove === 'Rock') {
                    result = 'You win.';
                }
                else if (computerMove === 'Paper') {
                    result = 'Tie.';
                }
                else if (computerMove === 'Scissors') {
                    result = 'You lose.'
                }
            } else if (playerMove === 'rock') {
                if (computerMove === 'Rock') {
                    result = 'Tie';
                }
                else if (computerMove === 'Paper') {
                    result = 'You lose.';
                }
                else if (computerMove === 'Scissors') {
                    result = 'You win.'
                }
            }
            if (result === 'You win.') {
                score.wins += 1;
            }
            else if (result === 'You lose.') {
                score.losses += 1;
            }
            else if (result === 'Tie.') {
                score.ties += 1;
            }
            localStorage.setItem('score', JSON.stringify(score))
            updateScore();
            document.querySelector('.js-result').innerHTML = result;
            document.querySelector('.js-move').innerHTML = `You 
            <img src="${playerMove}-emoji.png" class="js-icon">
            
            <img src="${computerMove}-emoji.png" class="js-icon"> computer`;

        }
        function updateScore() {
            document.querySelector('.js-score').innerHTML = `
            Wins : ${score.wins}, Losses : ${score.losses}, Ties : ${score.ties}
            `;
        }

        function pickComputerMove() {
            let randomNumber = Math.random();
            let computerMove = '';
            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = 'Rock';
            }
            else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = 'Paper';
            }
            else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'Scissors';
            }
            return computerMove;
        }
    </script>
</body>

</html>
