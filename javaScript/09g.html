<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Calculator</title>
</head>
<body>
    <input type="text" placeholder="Enter your number" class="input" onkeydown="
        handle();
        ">
    <button 
    onclick="

    calculateValue();

    "
    >Calculate</button>
    <p class="js-calculate"></p>
    <script>
        function handle(){
            if(event.key=='Enter')
        {
            calculateValue();
        }
        }
        function calculateValue()
        {
            let itemValue=document.querySelector('input').value;
            let value=Number(itemValue);
            document.querySelector('.js-calculate').innerHTML=`$${value}`;
        }
    </script>
</body>
</html>
