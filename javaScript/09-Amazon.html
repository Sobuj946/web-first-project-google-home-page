<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
</head>

<body>
    <p>Amazon Shipping Calculator.</p>
    <p>Orders under $40 =+$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>
    <input placeholder="Cost of order" class="input" onkeydown="
    handleCostKeydown();
    ">
    <button onclick="
    costCalculate();

    ">Calculate</button>
    <p class="js-total-cost"></p>
    <script>
        //type conversion
        String(25)
        console.log('25'-5);//automatically type conversion
        console.log('25'+5);//automatically convert the string concat

        function handleCostKeydown() {
            if (event.key === 'Enter') {
                costCalculate();
            }
        }
        function costCalculate() {
            const inputElement = document.querySelector('input');
            let cost = Number(inputElement.value);
            if (cost < 40) {
                cost += 10;
            }
            document.querySelector('.js-total-cost').innerHTML = `$${cost}`;

        }
    </script>
</body>

</html>
